id: com.usebottles.bottles
sdk: org.gnome.Sdk
runtime: org.gnome.Platform
base: org.winehq.Wine
base-version: stable-26.08
runtime-version: '50'
x-gl-version: &gl-version '1.4'
x-gl-versions: &gl-versions 26.08;26.08-extra;1.4
x-gl-merge-dirs: &gl-merge-dirs vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d;vdpau
command: bottles

finish-args:
  - --allow=devel
  - --allow=multiarch
  - --allow=per-app-dev-shm
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-data/umu:create
  - --filesystem=~/Games/umu:create
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=LD_LIBRARY_PATH=/usr/lib/extensions/vulkan/gamescope/lib:/app/lib/i386-linux-gnu/codecs-extra/lib:/app/lib:/app/lib/i386-linux-gnu
  - --env=PATH=/app/bin:/app/utils/bin:/usr/bin:/usr/lib/extensions/vulkan/MangoHud/bin/:/usr/bin:/usr/lib/extensions/vulkan/OBSVkCapture/bin/:/usr/lib/extensions/vulkan/gamescope/bin/
  - --env=GST_PLUGIN_SYSTEM_PATH=/app/lib/gstreamer-1.0:/app/lib32/gstreamer-1.0:/app/lib/i386-linux-gnu/codecs-extra/lib/gstreamer-1.0:/app/lib/i386-linux-gnu/gstreamer-1.0:/usr/lib/extensions/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/codecs-extra/lib/gstreamer-1.0:/usr/lib/i386-linux-gnu/codecs-extra/lib/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/gstreamer-1.0:/usr/lib/i386-linux-gnu/gstreamer-1.0
  - --require-version=1.1.2

sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

inherit-extensions:
  - org.winehq.Wine.gecko
  - org.winehq.Wine.mono

add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '26.08'

  org.freedesktop.Platform.Compat.i386.Debug:
    directory: lib/debug/lib/i386-linux-gnu
    version: '26.08'
    no-autodownload: true

  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: *gl-version
    versions: *gl-versions
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: *gl-merge-dirs
    download-if: active-gl-driver
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver

  org.freedesktop.Platform.GL32.Debug:
    directory: lib/debug/lib/i386-linux-gnu/GL
    version: *gl-version
    versions: *gl-versions
    subdirectories: true
    no-autodownload: true
    merge-dirs: *gl-merge-dirs
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver

  org.freedesktop.Platform.VAAPI.Intel.i386:
    directory: lib/i386-linux-gnu/dri/intel-vaapi-driver
    version: '26.08'
    versions: '26.08'
    autodelete: false
    no-autodownload: true
    add-ld-path: lib
    download-if: have-intel-gpu
    autoprune-unless: have-intel-gpu

  org.freedesktop.Platform.VAAPI.nvidia.i386:
    directory: i386/nvidia-vaapi-driver
    version: '26.08'
    versions: '26.08'
    autodelete: false
    no-autodownload: true
    add-ld-path: lib
    download-if: have-kernel-module-nvidia
    autoprune-unless: have-kernel-module-nvidia

  org.freedesktop.Platform.codecs_extra.i386:
    directory: lib/i386-linux-gnu/codecs-extra
    version: '26.08-extra'
    autodelete: false
    add-ld-path: lib

  com.valvesoftware.Steam.CompatibilityTool:
    subdirectories: true
    directory: share/steam/compatibilitytools.d
    version: stable
    versions: stable;beta;test
    no-autodownload: true
    autodelete: false

  com.valvesoftware.Steam.Utility:
    subdirectories: true
    directory: utils
    version: stable
    versions: stable;beta;test
    add-ld-path: lib
    merge-dirs: bin
    no-autodownload: true
    autodelete: false

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'

cleanup-commands:
  - mkdir -p /app/utils
  - mkdir -p /app/share/steam/compatibilitytools.d
  - mkdir -p /app/share/vulkan/implicit_layer.d/
  - mkdir -p /app/lib/i386-linux-gnu
  - mkdir -p /app/lib/debug/lib/i386-linux-gnu
  - mkdir -p /app/lib/i386-linux-gnu/GL
  - mkdir -p /app/lib/debug/lib/i386-linux-gnu/GL
  - mkdir -p /app/lib/i386-linux-gnu/dri/intel-vaapi-driver
  - mkdir -p /app/i386/nvidia-vaapi-driver
  - mkdir -p /app/lib/i386-linux-gnu/codecs-extra

modules:
  # Eagle modules
  - name: yara
    buildsystem: autotools
    config-opts:
      - "--disable-static"
      - "--enable-cuckoo"
      - "--enable-magic"
      - "--enable-dotnet"
    sources:
      - type: git
        url: https://github.com/VirusTotal/yara
        tag: v4.5.5
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"
    modules:
      - name: jansson
        buildsystem: cmake-ninja
        config-opts:
          - "-DJANSSON_BUILD_DOCS=OFF"
          - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        sources:
          - type: git
            url: https://github.com/akheron/jansson
            tag: v2.14.1
            x-checker-data:
              type: git
              tag-pattern: "^v([\\d.]+)$"
              
  # PYPI modules
  # ----------------------------------------------------------------------------
  - com.usebottles.bottles.pypi-deps.yaml
  - com.usebottles.bottles.fvs2-deps.yaml
  - com.usebottles.bottles.umu-launcher.yaml

  # Tools / Codecs
  # ----------------------------------------------------------------------------
  - name: vmtouch
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/hoytech/vmtouch
        commit: af86e27675843b3c7e4ddfee66ddbaf44eff43c4
        x-checker-data:
          type: json
          url: https://api.github.com/repos/hoytech/vmtouch/commits
          commit-query: first( .[].sha )
          timestamp-query: first( .[].commit.committer.date )
    build-commands:
      - make
      - make install PREFIX=/app
  - name: vulkan-tools
    buildsystem: cmake-ninja
    config-opts:
      - -DGLSLANG_INSTALL_DIR=/app
      - -DVULKAN_HEADERS_INSTALL_DIR=/app
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Vulkan-Tools.git
        tag: sdk-1.3.261.1
        commit: a7da7027ca9fd0901639f02619c226da9c6036f1
        x-checker-data:
          type: git
          tag-pattern: ^sdk-([\d.]+)$
    modules:
      - name: vulkan-tools
        buildsystem: cmake-ninja
        sources:
          - type: git
            url: https://github.com/KhronosGroup/Vulkan-Headers.git
            tag: sdk-1.3.261.1
            commit: 85c2334e92e215cce34e8e0ed8b2dce4700f4a50
            x-checker-data:
              type: git
              tag-pattern: ^sdk-([\d.]+)$

  # Libraries
  # ----------------------------------------------------------------------------

  - name: ImageMagick
    config-opts:
      - --disable-static
      - --disable-docs
      - --with-hdri
      - --with-pic
    sources:
      - type: git
        url: https://github.com/ImageMagick/ImageMagick
        tag: 7.1.1-47
        commit: 82572afc879b439cbf8c9c6f3a9ac7626adf98fb
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+-[\d]+)$

  - name: libportal
    buildsystem: meson
    config-opts:
      - -Dbackend-gtk3=disabled
      - -Dbackend-gtk4=enabled
      - -Dportal-tests=false
      - -Dvapi=false
      - -Ddocs=false
    sources:
      - type: git
        url: https://github.com/flatpak/libportal
        tag: 0.9.1
        commit: 8f5dc8d192f6e31dafe69e35219e3b707bde71ce
        x-checker-data:
          type: git
          is-important: true
          tag-pattern: ^([\d.]+)$

  - name: vkbasalt-cli
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=/app --root=/
    sources:
      - type: git
        url: https://gitlab.com/TheEvilSkeleton/vkbasalt-cli
        tag: v3.1.1
        commit: bba740f77357cfa3558f02f6b8decd8f5a8eaf4e
        x-checker-data:
          type: git
          is-important: true
          tag-pattern: ^v([\d.]+)$

  # Bottles components
  # ----------------------------------------------------------------------------

  - name: EasyTerm
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=/app --root=/
    sources:
      - type: git
        url: https://github.com/bottlesdevs/EasyTerm
        tag: 1.0.0
        commit: 4ab1f6a14111d05bcca9537bd479e450162e5a40
        x-checker-data:
          type: git
          is-important: true
          tag-pattern: ^([\d.]+)$
    modules:
      - name: vte
        buildsystem: meson
        config-opts:
          - -Ddocs=false
          - -Dvapi=false
        sources:
          - type: git
            url: https://gitlab.gnome.org/GNOME/vte
            tag: 0.78.0
            commit: 00c99e846bf83536f978b4fe5dc2c8a6983b8a94
            x-checker-data:
              type: git
              tag-pattern: ^([\d.]+)$

  - name: runtime
    buildsystem: simple
    build-commands:
      - mkdir -p /app/etc/runtime
      - cp -a * /app/etc/runtime/
    sources:
      - type: archive
        url: https://github.com/bottlesdevs/runtime/releases/download/0.6.3/runtime-0.6.3.tar.gz
        sha256: d7749b48927bd782e128e372a1d7085133fbe300eb9193134eb821f61bc5fad6
        x-checker-data:
          type: json
          is-important: true
          url: https://api.github.com/repos/bottlesdevs/runtime/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/bottlesdevs/runtime/releases/download/"
            + $version + "/runtime-" + $version + ".tar.gz"'

  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - install -Dm644 ld.so.conf -t /app/etc
    sources:
      - type: file
        path: ld.so.conf

  # Bottles source directory
  # ----------------------------------------------------------------------------
  - com.usebottles.bottles.src.yaml
